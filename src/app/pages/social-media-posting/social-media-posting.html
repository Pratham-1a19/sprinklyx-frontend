<div class="h-screen flex bg-[#F8FAFD]">
    <app-sidebar class="hidden md:block h-full"></app-sidebar>

    <div class="flex-1 flex flex-col min-w-0">
        <app-header
            class="kt-header h-16 z-10 flex items-center bg-background border-b border-border px-6 sticky top-0"></app-header>

        <main class="p-6 overflow-auto flex-1">
            <!-- Loading State -->
            <div *ngIf="isLoading" class="flex justify-center items-center h-64">
                <p class="text-gray-500">Verifying subscription...</p>
            </div>

            <!-- Paywall lockscreen -->
            <div *ngIf="!isLoading && !hasSubscription" class="mb-8 relative rounded-xl overflow-hidden shadow-lg border border-gray-200">
                <div class="blur-md p-8 bg-white opacity-40 select-none pointer-events-none">
                    <div style="padding: 2rem; max-width: 1000px; margin: 0 auto;">
                        <h2>Connect Platforms</h2>
                        <br>
                        <div class="h-64 bg-gray-100 rounded-lg"></div>
                    </div>
                </div>

                <div class="absolute inset-0 flex flex-col justify-center items-center bg-white/80 backdrop-blur-sm z-10 p-6 text-center">
                    <div class="w-16 h-16 bg-primary/10 text-primary rounded-full flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">Subscription Required</h3>
                    <p class="text-gray-600 mb-6 max-w-md">You need an active subscription to connect social media platforms and schedule large video posts. Start your Pro plan today!</p>
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-8 rounded-full shadow-lg transition-all" (click)="startSubscriptionCheckout()">
                        Subscribe with Stripe - $10/mo
                    </button>
                </div>
            </div>

            <!-- Unlocked Content -->
            <div *ngIf="!isLoading && hasSubscription" class="mb-8">
                <div class="posting-container" style="padding: 2rem; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 3rem;">
                    <div>
                        <h2 class="mb-4 text-2xl font-bold text-gray-800">Available Platforms</h2>
                        <!-- Embedded Component -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <app-connect-accounts></app-connect-accounts>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <app-footer></app-footer>
    </div>
</div>
